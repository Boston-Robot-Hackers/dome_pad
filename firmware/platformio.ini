; Yellow Pad: BLE gamepad for ROS teleop on the ESP32-2432S028R ("Cheap Yellow Display")
; Part of dome_pad. One env, cyd: the tabbed design (Drive / ROS / Settings), src/main.cpp.

[platformio]
default_envs = cyd

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lemmingdev/ESP32-BLE-Gamepad@0.8.0
    h2zero/NimBLE-Arduino@2.5.1
    ; ROS tab (rosbridge over Wi-Fi); same versions as the clock
    links2004/WebSockets@2.7.2
    bblanchon/ArduinoJson@7.4.3

build_flags =
    ; TFT_eSPI setup for the CYD's ILI9341 on the HSPI bus
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1
    ; ROS tab: a TCP connect to a missing rosbridge blocks the loop (and touch) this long
    -DWEBSOCKETS_TCP_TIMEOUT=1500
    ; rosbridge sends NaN for unknown fields (BatteryState has several); accept it
    -DARDUINOJSON_ENABLE_NAN=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000

[env:cyd]
build_src_filter = +<main.cpp> +<ros_tab.cpp>
